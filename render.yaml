# One-click full-stack deploy (frontend + backend on one Render web service):
# https://dashboard.render.com/blueprint/new?repo=https://github.com/Elle31416/casa-verde-voice-order-agent
#
# The backend (server/index.mjs) holds the AssemblyAI key, publishes the stored
# agent, mints short-lived browser tokens, accepts kitchen tickets, and serves
# the built React app from dist/. The browser talks to AssemblyAI directly over
# WebSocket, so there is no media server or telephony to configure.
#
# PUBLIC_URL is derived automatically from Render's RENDER_EXTERNAL_URL, so no
# URL configuration is needed unless you use a custom domain.
services:
  - type: web
    name: casa-verde-voice-order-agent
    runtime: node
    plan: free
    branch: arena/01a093ca-casa-verde-voice-order-agent
    buildCommand: npm ci && npm run typecheck && npm run test && npm run build
    startCommand: node server/index.mjs
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # The only required credential. Without it the site runs in scripted-demo
      # mode and the manual order API still works.
      - key: ASSEMBLYAI_API_KEY
        sync: false
      # Pinned agent id. Leave empty: the server creates/updates the agent by
      # name on startup. Visible here so it can be pinned or rotated.
      - key: AGENT_ID
        value: ''
      # Token lifetime (both optional; defaults 300 and 3600).
      - key: TOKEN_EXPIRES_IN_SECONDS
        value: ''
      - key: MAX_SESSION_DURATION_SECONDS
        value: ''
      # Optional split deployment: comma-separated origins of a separately
      # hosted frontend allowed to call this API cross-origin. Empty =
      # same-origin only (the default single-service setup).
      - key: ALLOWED_ORIGINS
        value: ''
