# One-click full-stack deploy (frontend + backend on one Render web service):
# https://dashboard.render.com/blueprint/new?repo=https://github.com/Elle31416/casa-verde-voice-order-agent&branch=arena%2F01a09119-casa-verde-voice-order-agent
#
# The backend (server/index.mjs) holds secrets, serves the built React app from
# dist/, mints AssemblyAI tokens, exposes the authenticated phone-agent tools,
# and runs the optional Twilio media bridge. PUBLIC_URL is derived automatically
# from Render's RENDER_EXTERNAL_URL, so no URL configuration is needed unless
# you use a custom domain (then set PUBLIC_URL in the dashboard).
services:
  - type: web
    name: casa-verde-voice-order-agent
    runtime: node
    plan: free
    branch: arena/01a09119-casa-verde-voice-order-agent
    buildCommand: npm ci && npm run typecheck && npm run build
    startCommand: node server/index.mjs
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # AssemblyAI key. Without it the site runs in scripted-demo mode and the
      # manual order API still works.
      - key: ASSEMBLYAI_API_KEY
        sync: false
      # Pinned agent ids. Leave empty: the server creates/updates agents by
      # name on startup. Visible here so they can be pinned or rotated.
      - key: AGENT_ID
        value: ''
      - key: PHONE_AGENT_ID
        value: ''
      # Authenticates the phone-agent remote tools (/menu, /order, /payment,
      # /receipt). Render pre-generates a value; accept it or set your own.
      - key: SHARED_SECRET
        sync: false
        generateValue: true
      # Keep false so the browser app can boot before phone secrets are
      # entered. Set true after SHARED_SECRET is configured to enforce phone
      # auth, and optionally set FAIL_ON_MISSING_PHONE_SECRET=true to refuse
      # startup when the secret is missing.
      - key: REQUIRE_PHONE_AUTH
        value: 'false'
      - key: FAIL_ON_MISSING_PHONE_SECRET
        value: 'false'
      # Optional Twilio phone bridge. TWILIO_VOICE_AGENT_ID is the Twilio API
      # Key SID (SK...) for the voice agent and TWILIO_API_SECRET is its
      # secret; enter both in Render Environment settings — the secret must
      # never be committed to the repository. The stream token is
      # pre-generated.
      - key: TWILIO_VOICE_AGENT_ID
        sync: false
      - key: TWILIO_API_SECRET
        sync: false
      - key: TWILIO_STREAM_SECRET
        generateValue: true
      # Optional real receipt delivery; otherwise /receipt returns a mock receipt.
      - key: RESEND_API_KEY
        value: ''
      - key: RECEIPT_FROM_EMAIL
        value: ''
      # Optional split deployment: comma-separated origins of a separately
      # hosted frontend allowed to call this API cross-origin. Empty =
      # same-origin only (the default single-service setup).
      - key: ALLOWED_ORIGINS
        value: ''
